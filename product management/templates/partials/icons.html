{# Reusable inline SVG icon set (no external icon library needed). #}
{% macro icon(name, size=20, cls='') -%}
<svg class="icon {{ cls }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24"
     fill="none" stroke="currentColor" stroke-width="1.7"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {%- if name == 'grid' -%}
    <rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/>
    <rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/>
  {%- elif name == 'box' -%}
    <path d="M21 8.5 12 3 3 8.5v7L12 21l9-5.5v-7Z"/><path d="M3 8.5 12 14l9-5.5"/><path d="M12 14v7"/>
  {%- elif name == 'tag' -%}
    <path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0l-7.2-7.2A2 2 0 0 1 2.8 12V4.8A2 2 0 0 1 4.8 2.8H12a2 2 0 0 1 1.4.6l7.2 7.2a2 2 0 0 1 0 2.8Z"/>
    <circle cx="7.5" cy="7.5" r="1.3"/>
  {%- elif name == 'swap' -%}
    <path d="M7 4v13"/><path d="m3.5 13.5 3.5 4 3.5-4"/>
    <path d="M17 20V7"/><path d="m13.5 10.5 3.5-4 3.5 4"/>
  {%- elif name == 'truck' -%}
    <path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h9A1.5 1.5 0 0 1 15 6.5V16H3Z"/>
    <path d="M15 9h3.2a2 2 0 0 1 1.7.9l1.6 2.6a2 2 0 0 1 .3 1V16h-6.8"/>
    <circle cx="7" cy="18" r="2"/><circle cx="17.5" cy="18" r="2"/>
  {%- elif name == 'file' -%}
    <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/>
    <path d="M14 3v5h5"/><path d="M9 13h6"/><path d="M9 17h4"/>
  {%- elif name == 'receipt' -%}
    <path d="M6 3h12a1 1 0 0 1 1 1v17l-3-2-2 2-2-2-2 2-3-2V4a1 1 0 0 1 1-1Z"/>
    <path d="M9 8h6"/><path d="M9 12h6"/><path d="M9 16h3"/>
  {%- elif name == 'chart' -%}
    <path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/>
  {%- elif name == 'layers' -%}
    <path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/><path d="m3 17.5 9 5 9-5"/>
  {%- elif name == 'alert' -%}
    <path d="M10.3 4.2 2.6 17.4A2 2 0 0 0 4.3 20.5h15.4a2 2 0 0 0 1.7-3.1L13.7 4.2a2 2 0 0 0-3.4 0Z"/>
    <path d="M12 9.5v4"/><path d="M12 17h.01"/>
  {%- elif name == 'wallet' -%}
    <path d="M20 8V6a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6"/>
    <path d="M16 13.5h2"/>
  {%- elif name == 'menu' -%}
    <path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/>
  {%- elif name == 'close' -%}
    <path d="m6 6 12 12"/><path d="m18 6-12 12"/>
  {%- elif name == 'calendar' -%}
    <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4"/><path d="M16 3v4"/><path d="M3 10h18"/>
  {%- elif name == 'database' -%}
    <ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>
    <path d="M4 11.5v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>
  {%- elif name == 'package' -%}
    <path d="M16.5 9.4 7.5 4.2"/><path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
    <path d="M3.3 7 12 12l8.7-5"/><path d="M12 22V12"/>
  {%- elif name == 'clock' -%}
    <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
  {%- elif name == 'arrow-down' -%}
    <path d="M12 4v16"/><path d="m6 14 6 6 6-6"/>
  {%- elif name == 'arrow-up' -%}
    <path d="M12 20V4"/><path d="m6 10 6-6 6 6"/>
  {%- elif name == 'check' -%}
    <path d="m4 12.5 5 5L20 6.5"/>
  {%- elif name == 'chevron-right' -%}
    <path d="m9 5 7 7-7 7"/>
  {%- elif name == 'sparkle' -%}
    <path d="M12 3.5 13.9 9l5.6 1.9-5.6 1.9L12 18.4l-1.9-5.6L4.5 10.9 10.1 9 12 3.5Z"/>
  {%- endif -%}
</svg>
{%- endmacro %}
